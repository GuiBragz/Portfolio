<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do Projeto · Gui Braga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="shortcut icon"
      href="https://i.ibb.co/Zz8ZMj7G/logo.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Biblioteca para converter Markdown do GitHub em HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #070707;
        --bg2: #0c0c0c;
        --bg3: #111111;
        --red: #dc2626;
        --red2: #ff3a3a;
        --red3: rgba(220, 38, 38, 0.12);
        --red-border: rgba(220, 38, 38, 0.28);
        --text: #f4f0ed;
        --text2: #c8c4c0;
        --muted: #8a8680;
        --muted2: #5c5855;
        --border: rgba(255, 255, 255, 0.07);
        --font: "DM Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", monospace;
        --display: "Bebas Neue", sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow-x: hidden;
        line-height: 1.6;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      ::-webkit-scrollbar {
        width: 3px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--red);
        border-radius: 4px;
      }

      header {
        padding: 2rem 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: rgba(7, 7, 7, 0.9);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
      }
      .back-btn {
        color: var(--muted);
        text-decoration: none;
        font-family: var(--mono);
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: color 0.2s;
      }
      .back-btn:hover {
        color: var(--red);
      }
      .nav-lang {
        background: none;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0.35rem 0.8rem;
        font-size: 0.72rem;
        font-family: var(--mono);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s;
      }
      .nav-lang:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.3);
      }

      /* Estrutura Principal */
      .proj-container {
        max-width: 900px;
        margin: 4rem auto;
        padding: 0 6%;
      }
      .proj-header {
        margin-bottom: 3rem;
        text-align: center;
      }

      .pj-status {
        font-family: var(--mono);
        font-size: 0.75rem;
        padding: 0.25rem 0.7rem;
        border-radius: 4px;
        background: var(--red3);
        color: var(--red);
        border: 1px solid var(--red-border);
        font-weight: 700;
        letter-spacing: 0.04em;
        display: inline-block;
        margin-bottom: 1rem;
      }
      .proj-title {
        font-family: var(--display);
        font-size: clamp(3rem, 8vw, 5rem);
        letter-spacing: 0.02em;
        line-height: 1;
        margin-bottom: 1rem;
      }
      .proj-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .btn-red {
        background: var(--red);
        color: #fff;
        padding: 0.8rem 1.7rem;
        border-radius: 7px;
        font-size: 0.88rem;
        font-weight: 700;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(220, 38, 38, 0.35);
        transition: all 0.2s;
        font-family: var(--mono);
      }
      .btn-red:hover {
        opacity: 0.85;
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(220, 38, 38, 0.45);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        padding: 0.8rem 1.7rem;
        border-radius: 7px;
        font-size: 0.88rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s;
        font-family: var(--mono);
      }
      .btn-ghost:hover {
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
      }

      /* Estilização do Markdown do GitHub */
      .github-content {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 2.5rem;
        color: var(--text2);
        line-height: 1.8;
        font-size: 1.05rem;
      }
      .github-content h1,
      .github-content h2,
      .github-content h3 {
        color: var(--text);
        font-family: var(--font);
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      .github-content h1 {
        font-size: 2.2rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
      }
      .github-content h2 {
        font-size: 1.8rem;
      }
      .github-content p {
        margin-bottom: 1.2rem;
      }
      .github-content a {
        color: var(--red);
        text-decoration: none;
        font-weight: 600;
      }
      .github-content a:hover {
        text-decoration: underline;
      }
      .github-content img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        margin: 1.5rem 0;
        display: block;
        border: 1px solid var(--border);
      }
      .github-content ul,
      .github-content ol {
        margin-left: 1.5rem;
        margin-bottom: 1.2rem;
      }
      .github-content li {
        margin-bottom: 0.5rem;
      }
      .github-content pre {
        background: var(--bg);
        padding: 1.2rem;
        border-radius: 8px;
        overflow-x: auto;
        border: 1px solid var(--border);
        margin-bottom: 1.5rem;
        font-family: var(--mono);
        font-size: 0.9rem;
      }
      .github-content code {
        background: rgba(255, 255, 255, 0.1);
        padding: 0.15rem 0.4rem;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 0.85em;
        color: var(--red2);
      }
      .github-content pre code {
        background: none;
        padding: 0;
        color: inherit;
      }
      .github-content blockquote {
        border-left: 4px solid var(--red);
        padding-left: 1rem;
        color: var(--muted);
        margin: 1.5rem 0;
        font-style: italic;
        background: rgba(220, 38, 38, 0.05);
        padding: 1rem;
        border-radius: 0 8px 8px 0;
      }

      /* Loading State */
      .loader {
        text-align: center;
        padding: 4rem 0;
        color: var(--muted);
        font-family: var(--mono);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      @media (max-width: 768px) {
        .github-content {
          padding: 1.5rem;
        }
        .proj-title {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="projetos.html" class="back-btn"
        >← <span data-t="back">Voltar aos Projetos</span></a
      >
      <button class="nav-lang" onclick="toggleLang()" id="langBtn">
        🇧🇷 PT
      </button>
    </header>

    <main class="proj-container">
      <div class="proj-header" id="proj-header" style="display: none">
        <span class="pj-status" id="proj-status">...</span>
        <h1 class="proj-title" id="proj-title">Carregando...</h1>

        <div class="proj-actions">
          <a
            href="#"
            target="_blank"
            class="btn-red"
            id="btn-live"
            data-t="btn_access"
            >Acessar Projeto ↗</a
          >
          <a href="#" target="_blank" class="btn-ghost" id="btn-repo"
            >GitHub 🐙</a
          >
        </div>
      </div>

      <div id="readme-container">
        <div class="loader" id="loader" data-t="loading">
          Buscando dados no GitHub...
        </div>
      </div>
    </main>

    <script>
      // O MESMO array da tela de projetos.
      const PROJETOS = [
        {
          id: "nivro",
          nome: "Nivro",
          status: "MOBILE",
          repo: "GuiBragz/Nivro",
          liveUrl: "", // Vazio, esconde o botão
        },
        {
          id: "zentry",
          nome: "Zentry",
          status: "WEB",
          repo: "GuiBragz/Zentry",
          liveUrl: "https://usezentry.vercel.app", // Esse vai abrir!
        },
        {
          id: "hexcolor",
          nome: "HexColor",
          status: "TOOL",
          repo: "GuiBragz/HexColor",
          liveUrl: "https://hexcolorultra.vercel.app", // Esse vai abrir!
        },
        {
          id: "nutricare",
          nome: "StheNutriCare",
          status: "APP",
          repo: "GuiBragz/Sthe_NutriCare",
          liveUrl: "", // Vazio, esconde o botão
        },
      ];

      const T = {
        pt: {
          back: "Voltar aos Projetos",
          btn_access: "Acessar Projeto ↗",
          loading: "Buscando dados no GitHub...",
          error_not_found: "Projeto não encontrado na base de dados.",
          error_fetch:
            "Não foi possível carregar o README do GitHub no momento. O repositório pode ser privado ou o limite da API foi atingido.",
        },
        en: {
          back: "Back to Projects",
          btn_access: "Access Project ↗",
          loading: "Fetching data from GitHub...",
          error_not_found: "Project not found in the database.",
          error_fetch:
            "Could not load the README from GitHub right now. The repository might be private or the API limit was reached.",
        },
      };

      let lang = "pt";
      let currentProject = null;

      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get("id");

      function initPage() {
        if (!projectId) {
          showError(T[lang].error_not_found);
          return;
        }

        currentProject = PROJETOS.find((p) => p.id === projectId);

        if (!currentProject) {
          showError(T[lang].error_not_found);
          return;
        }

        document.getElementById("proj-title").innerText = currentProject.nome;
        document.getElementById("proj-status").innerText =
          currentProject.status;

        // Exibe ou esconde o botão de acessar o projeto
        const btnLive = document.getElementById("btn-live");
        if (
          currentProject.liveUrl &&
          currentProject.liveUrl !== "#" &&
          currentProject.liveUrl !== ""
        ) {
          btnLive.href = currentProject.liveUrl;
          btnLive.style.display = "inline-flex";
        } else {
          btnLive.style.display = "none";
        }

        document.getElementById("btn-repo").href =
          `https://github.com/${currentProject.repo}`;
        document.getElementById("proj-header").style.display = "block";

        fetchReadme();
      }

      async function fetchReadme() {
        const container = document.getElementById("readme-container");
        document.getElementById("loader").innerText = T[lang].loading;
        document.getElementById("loader").style.display = "block";

        let readmeFile = lang === "en" ? "README-en.md" : "README.md";

        try {
          let response = await fetch(
            `https://api.github.com/repos/${currentProject.repo}/contents/${readmeFile}`,
            {
              headers: { Accept: "application/vnd.github.v3.raw" },
            },
          );

          if (!response.ok && lang === "en") {
            response = await fetch(
              `https://api.github.com/repos/${currentProject.repo}/contents/README.md`,
              {
                headers: { Accept: "application/vnd.github.v3.raw" },
              },
            );
          }

          if (!response.ok) throw new Error("Network response was not ok");

          const markdownText = await response.text();
          const htmlContent = marked.parse(markdownText);

          container.innerHTML = `<div class="github-content">${htmlContent}</div>`;
        } catch (error) {
          console.error("Erro ao buscar README:", error);
          container.innerHTML = `
            <div class="github-content" style="text-align:center; color: var(--red2);">
              <p>⚠️ ${T[lang].error_fetch}</p>
              <br>
              <a href="https://github.com/${currentProject.repo}" target="_blank" class="btn-ghost">Ver direto no GitHub ↗</a>
            </div>`;
        }
      }

      function showError(msg) {
        document.getElementById("readme-container").innerHTML = `
          <div style="text-align:center; padding: 4rem 0; color: var(--red2); font-family: var(--mono);">
            <h2>⚠️ Erro 404</h2>
            <p>${msg}</p>
            <br>
            <a href="projetos.html" class="btn-ghost">Voltar aos projetos</a>
          </div>
        `;
      }

      function applyLang() {
        document.querySelectorAll("[data-t]").forEach((el) => {
          const k = el.dataset.t;
          if (T[lang][k] !== undefined) el.innerHTML = T[lang][k];
        });
        document.getElementById("langBtn").innerHTML =
          lang === "pt" ? "🇧🇷 PT" : "🇺🇸 EN";
        document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";

        if (currentProject) fetchReadme();
      }

      function toggleLang() {
        lang = lang === "pt" ? "en" : "pt";
        applyLang();
      }

      document.addEventListener("DOMContentLoaded", () => {
        applyLang();
        initPage();
      });
    </script>
  </body>
</html>
