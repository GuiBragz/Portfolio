<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas Certificações · Gui Braga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="shortcut icon"
      href="https://i.ibb.co/Zz8ZMj7G/logo.png"
      type="image/x-icon"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #121212;
        --bg2: #1e1e1e;
        --bg3: #252525;
        --red: #ef4444;
        --red2: #ff6b6b;
        --red3: rgba(239, 68, 68, 0.15);
        --red-border: rgba(239, 68, 68, 0.35);
        --text: #ffffff;
        --text2: #e5e5e5;
        --muted: #b3b3b3;
        --muted2: #999999;
        --border: rgba(255, 255, 255, 0.1);
        --font: "DM Sans", system-ui, sans-serif;
        --mono: "JetBrains Mono", monospace;
        --display: "Bebas Neue", sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow-x: hidden;
        line-height: 1.7;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      header {
        padding: 2rem 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        background: var(--bg2);
      }
      .back-btn {
        color: var(--muted);
        text-decoration: none;
        font-family: var(--mono);
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: color 0.2s;
      }
      .back-btn:hover {
        color: var(--red);
      }
      .nav-lang {
        background: none;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0.35rem 0.8rem;
        font-size: 0.72rem;
        font-family: var(--mono);
        color: var(--muted);
        cursor: pointer;
      }
      .nav-lang:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.3);
      }
      .main-title {
        font-family: var(--display);
        font-size: clamp(3rem, 8vw, 5rem);
        letter-spacing: 0.02em;
        color: var(--text);
        text-align: center;
        margin: 4rem 6% 1rem;
      }
      .main-title em {
        color: var(--red);
        font-style: normal;
      }
      .subtitle {
        text-align: center;
        color: var(--muted);
        max-width: 600px;
        margin: 0 auto 4rem;
        padding: 0 6%;
        font-size: 1.05rem;
      }
      .certs-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 0 6% 6rem;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }
      .cert-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 1.2rem 1.6rem;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 10px;
        transition:
          border-color 0.2s,
          transform 0.2s;
        opacity: 0;
        transform: translateY(15px);
      }
      .cert-row.vis {
        opacity: 1;
        transform: translateY(0);
      }
      .cert-row:hover {
        border-color: var(--red-border);
        transform: translateX(5px);
      }
      .cert-main {
        display: flex;
        align-items: center;
        gap: 1.2rem;
      }
      .cert-ico {
        font-size: 1.6rem;
        flex-shrink: 0;
      }
      .cert-name {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 0.15rem;
      }
      .cert-meta {
        font-size: 0.85rem;
        color: var(--muted);
        font-family: var(--font);
      }
      .cert-meta strong {
        color: var(--red);
        font-weight: 500;
      }
      .cert-yr {
        font-size: 0.88rem;
        color: var(--muted2);
        font-family: var(--mono);
        font-weight: bold;
        background: var(--bg);
        padding: 0.3rem 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--border);
      }

      @media (max-width: 600px) {
        .cert-row {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.8rem;
        }
        .cert-yr {
          align-self: flex-end;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="back-btn"
        >← <span data-t="back">Voltar ao Portfólio</span></a
      >
      <button class="nav-lang" onclick="toggleLang()" id="langBtn">
        🇧🇷 PT
      </button>
    </header>

    <main>
      <h1 class="main-title" data-t="title">Minhas <em>Certificações</em></h1>
      <p class="subtitle" data-t="sub">
        Histórico de cursos concluídos e certificados obtidos para aprimoramento
        contínuo técnico e profissional.
      </p>

      <div class="certs-container" id="container-certificados"></div>
    </main>

    <script {safe}>
      // ==========================================
      // ARRAYS DE CERTIFICADOS - ADICIONE NOVOS AQUI!
      // ==========================================
      const CERTIFICADOS = [
        {
          icone: "🤖",
          nomePt: "Automação de Sistemas",
          nomeEn: "Systems Automation",
          org: "IFRS",
          ano: "2025",
        },
        {
          icone: "☁️",
          nomePt: "IA com Azure",
          nomeEn: "AI with Azure",
          org: "Fundação Bradesco",
          ano: "2025",
        },
        {
          icone: "🗃️",
          nomePt: "Modelagem de Dados",
          nomeEn: "Data Modeling",
          org: "Fundação Bradesco",
          ano: "2024",
        },
        {
          icone: "🐍",
          nomePt: "Introdução à Python",
          nomeEn: "Introduction to Python",
          org: "Santander Open Academy",
          ano: "2024",
        },
        // Para adicionar um novo certificado, copie o modelo abaixo e cole aqui antes do colchete de fechamento:
        /*
        ,{
          icone: "🎓",
          nomePt: "Nome do Curso em Português",
          nomeEn: "Course Name in English",
          org: "Instituição Emissora",
          ano: "2026"
        }
        */
      ];

      const T = {
        pt: {
          back: "Voltar ao Portfólio",
          title: "Minhas <em>Certificações</em>",
          sub: "Histórico de cursos concluídos e certificados obtidos para aprimoramento contínuo técnico e profissional.",
          by: "por",
        },
        en: {
          back: "Back to Portfolio",
          title: "My <em>Certifications</em>",
          sub: "History of completed courses and certificates obtained for continuous technical and professional improvement.",
          by: "by",
        },
      };

      let lang = "pt";

      function renderCertificados() {
        const container = document.getElementById("container-certificados");
        container.innerHTML = "";

        // Ordenando automaticamente para deixar sempre os mais recentes no topo
        const certsOrdenados = [...CERTIFICADOS].sort((a, b) => b.ano - a.ano);

        certsOrdenados.forEach((cert, idx) => {
          const nome = lang === "pt" ? cert.nomePt : cert.nomeEn;
          const preposicao = T[lang].by;

          const row = document.createElement("div");
          row.className = "cert-row";
          row.innerHTML = `
            <div class="cert-main">
              <span class="cert-ico">${cert.icone}</span>
              <div>
                <div class="cert-name">${nome}</div>
                <div class="cert-meta">${preposicao} <strong>${cert.org}</strong></div>
              </div>
            </div>
            <div class="cert-yr">${cert.ano}</div>
          `;
          container.appendChild(row);

          // Efeito cascata suave para revelar as linhas
          setTimeout(() => {
            row.classList.add("vis");
          }, idx * 80);
        });
      }

      function applyLang() {
        document.querySelectorAll("[data-t]").forEach((el) => {
          const k = el.dataset.t;
          if (T[lang][k] !== undefined) el.innerHTML = T[lang][k];
        });
        document.getElementById("langBtn").innerHTML =
          lang === "pt" ? "🇧🇷 PT" : "🇺🇸 EN";
        document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
        renderCertificados();
      }

      function toggleLang() {
        lang = lang === "pt" ? "en" : "pt";
        applyLang();
      }

      document.addEventListener("DOMContentLoaded", applyLang);
    </script>
  </body>
</html>
